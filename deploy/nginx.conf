server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/octet-stream text/css;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /data/ {
        types { application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # current METAR for LaGuardia (aviationweather.gov sends no CORS headers)
    location = /api/metar {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $aw https://aviationweather.gov;
        proxy_pass $aw/api/data/metar?ids=KLGA&format=json;
        proxy_ssl_server_name on;
        proxy_set_header Host aviationweather.gov;
        proxy_set_header User-Agent "planr (+https://github.com/sensedrive/planr)";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
