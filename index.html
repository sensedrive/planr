<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>planr – VR-Flugsimulator</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc3e0; font-family: ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 14px; border-radius: 8px;
        background: rgba(10, 16, 24, 0.55); color: #e8f0f8; font: 13px/1.5 ui-monospace, Menlo, monospace;
        pointer-events: none; white-space: pre; min-width: 190px;
      }
      #hud .warn { color: #ff5a4a; font-weight: 700; }
      #help {
        position: fixed; bottom: 12px; left: 12px; padding: 10px 14px; border-radius: 8px;
        background: rgba(10, 16, 24, 0.55); color: #e8f0f8; font: 12px/1.6 ui-sans-serif, system-ui, sans-serif;
        pointer-events: none;
      }
      #help kbd { background: rgba(255,255,255,0.15); border-radius: 3px; padding: 0 4px; font-family: ui-monospace, Menlo, monospace; }
      #message {
        position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); padding: 16px 26px; border-radius: 10px;
        background: rgba(10, 16, 24, 0.7); color: #fff; font-size: 22px; text-align: center; pointer-events: none; display: none;
      }
      #message small { display: block; font-size: 14px; opacity: 0.8; margin-top: 6px; }
      body.xr #hud, body.xr #help, body.xr #message { display: none !important; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="help">
      <b>Steuerung</b><br />
      <kbd>W</kbd>/<kbd>S</kbd> drücken/ziehen · <kbd>A</kbd>/<kbd>D</kbd> rollen · <kbd>Q</kbd>/<kbd>E</kbd> Seitenruder<br />
      <kbd>Shift</kbd>/<kbd>X</kbd> oder Mausrad Gas · <kbd>B</kbd> Bremse · <kbd>F</kbd>/<kbd>V</kbd> Klappen · <kbd>T</kbd>/<kbd>G</kbd> Trimmung<br />
      <kbd>C</kbd> Kamera · Maus ziehen umsehen · <kbd>R</kbd> Neustart · <kbd>L</kbd> Luftstart · <kbd>P</kbd> Pause · <kbd>M</kbd> Ton · <kbd>H</kbd> Hilfe
    </div>
    <div id="message"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
